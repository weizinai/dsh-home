# Agent preset standard-lite: the shipped `standard` preset with Goal, plan mode, and five delegation rows removed.
# Maintained by the dsh-home repository.
# Derived from @deepseek-ai/dsh-web-app `presets/standard.patch.yml` (0.2.0-rc.2). This is a snapshot,
# not a diff: when that upstream preset gains an entry, re-compare it against this list.
# Removed relative to the shipped `standard` preset (all unused here):
#   - command-goal              (@deepseek-ai/dsh-command-goal)   — unused
#   - tool-goal                 (@deepseek-ai/dsh-tool-goal)      — unused
#   - planning + plan-mode      (cordis:group)                    — unused
#   - tool-subagent-codex       (@deepseek-ai/dsh-tool-subagent)  — unused
#   - tool-subagent-claude-code (@deepseek-ai/dsh-tool-subagent)  — unused
#   - workflow-ptc              (@deepseek-ai/dsh-workflow-ptc)   — unused
#   - tool-workflow             (@deepseek-ai/dsh-tool-workflow)  — unused
#   - tool-ralph                (@deepseek-ai/dsh-tool-ralph)     — unused
# The last three are enabled in the shipped `standard`, so removing them is a behaviour change,
# not just cleanup. The plugin list is otherwise the shipped `standard` list verbatim — bare
# `present` with no PTC tool presentation; only the metadata above it differs (preset id
# `standard-lite`, name `Standard Lite`, order 5 instead of 1).
- insert:
    - id: preset-standard-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard-lite
        name: Standard Lite
        description: Standard tool presentation without Goal, plan mode, or the unused delegation rows.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
