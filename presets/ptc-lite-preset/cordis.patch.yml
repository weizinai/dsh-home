# Agent preset ptc-lite: the shipped `ptc` preset trimmed to what this profile uses.
# Maintained by the dsh-home repository.
# Derived from @deepseek-ai/dsh-web-app `presets/ptc.patch.yml` (0.2.1-alpha.2). This is a snapshot,
# not a diff: when that upstream preset gains an entry, re-compare it against this list.
# Removed relative to the shipped `ptc` preset — all unused here, removal is deliberate:
#   - command-goal, tool-goal      (@deepseek-ai/dsh-command-goal, @deepseek-ai/dsh-tool-goal)
#   - planning + plan-mode         (cordis:group)
#   - time-context                 (@deepseek-ai/dsh-time-context)
#   - tool-schedule                (@deepseek-ai/dsh-tool-schedule)
#   - workflow-ptc, tool-workflow  (@deepseek-ai/dsh-workflow-ptc, @deepseek-ai/dsh-tool-workflow)
# The rest is the shipped `ptc` list verbatim, PTC tool presentation included; only the metadata
# above it differs (preset id `ptc-lite`, name `PTC Lite`, order 6 instead of 2).
#
# Dropping `tool-schedule` also drops the two subagent `toolFilter.deny` blocks: those `schedule_*`
# names are restrictable only while this preset mounts the reminder tools, and `tools.restrict()`
# throws on an unknown name, so the deny lists travel with the row.
- insert:
    - id: preset-ptc-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ptc-lite
        name: PTC Lite
        description: PTC tool presentation without Goal, plan mode, or the unused delegation rows.
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
